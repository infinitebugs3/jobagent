[project]
name = "jobagent"
version = "0.1.0"
description = "ATS-first job search agent - phase 1"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Day 6. Pulls in torch, so it is a large download - deliberately separate.
match = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobagent"]
